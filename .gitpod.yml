image: gitpod/workspace-full:latest

tasks:
  - init: |
      # Install Go dependencies
      go mod download
      # Install Supabase CLI from source
      go build -o supabase .
      sudo mv supabase /usr/local/bin/
  - command: |
      echo "Supabase CLI development environment ready!"
      supabase --version

ports:
  - port: 54321
    onOpen: notify
    description: Supabase local development

vscode:
  extensions:
    - golang.go
    - ms-vscode.vscode-json